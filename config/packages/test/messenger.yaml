# Testy nie mogą wysyłać wiadomości do wspólnego RabbitMQ: worker instancji dev przetworzyłby
# je na swojej bazie (ID obiektów z bazy testowej). Transporty doctrine i tak trafiają do bazy testowej.
# pimcore_core jest synchroniczny, bo przez niego idzie m.in. kasowanie wersji usuniętych obiektów
# (VersionDeleteMessage) - inaczej baza testowa zbierałaby osierocone wersje.
framework:
    messenger:
        transports:
            pimcore_core: 'sync://'
            pimcore_maintenance: 'in-memory://'
            pimcore_scheduled_tasks: 'in-memory://'
            pimcore_image_optimize: 'in-memory://'
            pimcore_asset_update: 'in-memory://'
